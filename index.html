<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LeTour - Tour de France 2025</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: #000; 
        color: #ff0; 
        font-family: 'Courier New', monospace; 
        padding: 16px; 
        font-size: 16px; 
    }
    
    #game { 
        max-width: 1150px; 
        margin: 0 auto; 
        border: 3px solid #ff0; 
        padding: 18px; 
        background: #110; 
        border-radius: 6px; 
    }

    h1 { 
        color: #ff0; 
        text-align: center; 
        margin-bottom: 14px; 
        font-size: 34px; 
    }
    h2 { 
        color: #ff0; 
        border-bottom: 2px solid #aa0; 
        padding-bottom: 6px; 
        margin-bottom: 12px; 
        font-size: 24px; 
    }

    h3 { 
        color: #0ff; 
        margin-bottom: 8px; 
        font-size: 18px; 
    }
    .box { 
        border: 2px solid #aa0; 
        padding: 14px; 
        margin: 12px 0; 
        background: #110; 
        border-radius: 5px; 
    }
        
    .hl { color: #ff0; }
    .ok { color: #0f0; }
    .pos { color: #ff0; }
    .warn { color: #f80; }
    .bad { color: #f44; }
    .cyan { color: #0ff; }
    
.btn { 
    background: #111; 
    color: #0f0; 
    border: 2px solid #0f0; 
    padding: 10px 22px; 
    margin: 4px; 
    cursor: pointer; 
    font-family: inherit; 
    font-size: 17px; 
    border-radius: 5px; 
}
.btn:hover { background: #0f0; color: #000; }
/* Grøn knap hover */
.btn[style*="border-color:#0f0"]:hover {
    background: #0f0;
    color: #000;
}

/* Blå knap hover */
.btn[style*="border-color:#3399ff"]:hover {
    background: #3399ff;
    color: #000;
}


/* SPECIFIKT for Fuld gas / blå knappen (enkeltstart) */
.btn[style*="border-color:#3399ff"] {
    color: #3399ff;   /* blå tekst i normal tilstand */
}

.btn[style*="border-color:#3399ff"]:hover { 
    background: #003366; 
    color: #3399ff; 
}
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-big { 
        padding: 14px 32px; 
        font-size: 20px; 
    }
    .btn-y { border-color: #ff0; color: #ff0; }
    .btn-y:hover { background: #ff0; color: #000; }
    .btn-r { border-color: #f44; color: #f44; }
    .btn-r:hover { background: #f44; color: #fff; }
    
    input { 
        background: #111; 
        border: 2px solid #ff0; 
        color: #ff0; 
        padding: 12px; 
        font-size: 20px; 
        font-family: inherit; 
        border-radius: 5px; 
        width: 100%; 
        max-width: 360px; 
    }
    input:focus { outline: none; border-color: #ff0; }
    
    canvas { 
        width: 100%; 
        height: 230px; 
        border: 2px solid #aa0; 
        background: linear-gradient(180deg, #111 0%, #110 100%); 
        display: block; 
        margin: 10px 0; 
        border-radius: 5px; 
    }

    
    .ebar { 
        background: #222; 
        border: 2px solid #aa0; 
        border-radius: 10px; 
        width: 190px; 
        height: 18px; 
        display: inline-block; 
        vertical-align: middle; 
        overflow: hidden; 
    }

    .efill { 
        height: 100%; 
        background: linear-gradient(90deg, #0f0, #0a0); 
        border-radius: 10px; 
        transition: width 0.3s; 
    }
    .efill.low { background: linear-gradient(90deg, #f44, #a00); }
    .efill.med { background: linear-gradient(90deg, #f80, #a50); }
    
    .grp { 
        border: 2px solid #444; 
        padding: 10px; 
        margin: 5px; 
        border-radius: 5px; 
        font-size: 14px; 
        display: inline-block; 
        vertical-align: top; 
        min-width: 260px; 
    }
    .grp.udbrud { border-color: #f80; background: linear-gradient(135deg, #210 0%, #100 100%); }
    .grp.felt { border-color: #ff0; background: linear-gradient(135deg, #220 0%, #110 100%); }
    .grp.gruppetto { border-color: #666; background: linear-gradient(135deg, #111 0%, #000 100%); }
    .grp.her { 
        border-color: #ff0; 
        border-width: 3px; 
        background: linear-gradient(135deg, #330 0%, #110 100%); 
        box-shadow: 0 0 12px #ff04; 
    }
    
    .row { 
        padding: 4px 8px; 
        font-size: 14px; 
        border-bottom: 1px solid #330; 
        display: flex; 
        justify-content: space-between; 
        align-items: center;  
    }

    .row.pl { background: #333; color: #fff; }
    
    .ctrls { 
        text-align: center; 
        margin: 12px 0; 
    }
    
    .modal { 
        position: fixed; 
        top: 0; left: 0; right: 0; bottom: 0; 
        background: rgba(0,0,0,0.92); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        z-index: 99; 
    }
    .mbox { 
        border: 3px solid #ff0; 
        padding: 30px; 
        background: linear-gradient(135deg, #111 0%, #000 100%); 
        border-radius: 12px; 
        text-align: center; 
        max-width: 520px; 
        box-shadow: 0 0 40px #ff02; 
    }
    
    .jerseys { 
        display: flex; 
        gap: 10px; 
        justify-content: center; 
        flex-wrap: wrap; 
        margin: 10px 0; 
    }
    .jersey { 
        padding: 8px 15px; 
        border-radius: 8px; 
        font-size: 14px; 
        text-align: center; 
        min-width: 100px; 
        font-weight: bold; 
    }
    .jy { background: linear-gradient(135deg, #ff0 0%, #cc0 100%); color: #000; box-shadow: 0 0 10px #ff04; }
    .jg { background: linear-gradient(135deg, #0f0 0%, #0a0 100%); color: #000; box-shadow: 0 0 10px #0f04; }
    .jp { background: linear-gradient(135deg, #fff 0%, #ddd 100%); color: #f00; box-shadow: 0 0 10px #fff4; }
    
    .sbar { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        margin: 4px 0; 
        font-size: 14px; 
    }
    .sbar .lbl { width: 100px; }
    .sbar .bg { 
        flex: 1; 
        height: 12px; 
        background: #222; 
        border-radius: 6px; 
        overflow: hidden; 
    }
    .sbar .fill { height: 100%; border-radius: 6px; }
    
    .tabs { 
        display: flex; 
        gap: 6px; 
        margin-bottom: 12px; 
    }
    .tab { 
    padding: 8px 15px; 
    border: 2px solid #aa0; 
    cursor: pointer; 
    border-radius: 4px; 
    font-size: 14px; 
    color: #ff0;
}
.tab.active { background: #aa0; color: #000; }
.tab:hover { background: #330; color: #ff0; }
.tab.active:hover { background: #aa0; color: #000; }

.tab-gc { border-color: #ff0; }
.tab-gc.active { background: #ff0; color: #000; }
.tab-gc:hover { background: #330; color: #ff0; }
.tab-gc.active:hover { background: #ff0; color: #000; }

.tab-sp { border-color: #0f0; }
.tab-sp.active { background: #0f0; color: #000; }
.tab-sp:hover { background: #030; color: #0f0; }
.tab-sp.active:hover { background: #0f0; color: #000; }

.tab-bj { border-color: #f44; }
.tab-bj.active { background: #f44; color: #000; }
.tab-bj:hover { background: #300; color: #f44; }
.tab-bj.active:hover { background: #f44; color: #000; }


    
    .mp-result { 
        background: linear-gradient(135deg, #220 0%, #110 100%); 
        border: 2px solid #f80; 
        padding: 12px; 
        border-radius: 8px; 
        margin: 10px 0; 
    }
    .mp-result h4 { 
        color: #f80; 
        margin-bottom: 10px; 
        font-size: 16px; 
    }
    
    .time-display { 
        font-family: 'Courier New', monospace; 
        background: #000; 
        border: 2px solid #3399ff; 
        padding: 10px 18px; 
        border-radius: 5px; 
        display: inline-block; 
        font-size: 18px; 
        color: #ff0;
    }

            /* Mobiltilpasning */
     /* -- STYR VISNING AF TOP-BAR -- */
    .top-bar-mobile {
        display: none !important; /* Skjul mobil-versionen som standard */
    }

    @media (max-width: 768px) {
        /* Regler til at skifte top-bar */
        .top-bar-desktop {
            display: none !important;
        }
        .top-bar-mobile {
            display: block !important;
        }
        
        /* Skjul trøjer */
        .jerseys {
            display: none; /* Skjul trøjerne OG titlen helt på mobil */
        }

        .jerseys-box {
        display: none !important;
        }

        div[style*="text-align:center"] .btn-big {
            min-width: 100px !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            }
        
        /* Generelle mobil-styles */
        body {
            padding: 8px;
            font-size: 14px;
        }
        #game {
            border-width: 2px;
            padding: 10px;
        }
        h1 { font-size: 26px; }
        h2 { font-size: 20px; }
        h3 { font-size: 16px; }

        .btn {
            font-size: 14px;
            padding: 8px 14px;
        }
        .btn-big {
            font-size: 16px;
            padding: 10px 20px;
        }

        canvas {
            height: 180px;
        }
   
        .row {
            line-height: 1.4;
        }
    
        .row span:first-child {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .naeste-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .naeste-tekst {
            text-align: center;
            line-height: 1.2;
        }
        
        .naeste-pil {
            font-size: 20px;
        }

	}

    /* Forhindre zoom ved dobbeltklik/hurtige tryk */
    button, .btn {
        touch-action: manipulation;
    }

    html, body {
        touch-action: pan-y;

        /* Knap-layout på mobil */
        .ctrls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        
        .ctrls .btn-big {
            flex: 1 1 auto;
            max-width: 48%;
        }
        
        /* Hvis 3 knapper på mobil */
        .ctrls-3 .btn-big {
            flex: 1 1 30%;
            min-width: 90px;
        }

    }
    /* Sværhedsgrad styling */
    .svaerhed-valg {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 10px 0;
    }
    .svaerhed-boks {
        padding: 12px 20px;
        border: 3px solid #666;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        min-width: 120px;
        transition: all 0.2s;
        background: #111;
    }
    .svaerhed-boks:hover {
        transform: scale(1.05);
    }
    .svaerhed-boks.let { border-color: #0f0; color: #0f0; }
    .svaerhed-boks.let.valgt { background: #0b3; box-shadow: 0 0 2px #0f0; color: #000; }
    .svaerhed-boks.normal { border-color: #ff0; color: #ff0; }
    .svaerhed-boks.normal.valgt { background: #ff0; box-shadow: 0 0 2px #ff0; color: #000; }
    .svaerhed-boks.svaer { border-color: #f44; color: #f44; }
    .svaerhed-boks.svaer.valgt { background: #f44; box-shadow: 0 0 2px #f44; color: #000; }
.svaerhed-boks .navn { font-size: 16px; font-weight: bold; }

    /* Skjul/vis tekst baseret på skærm */
    .mobil-txt {
        display: none;
    }
    
    @media (max-width: 768px) {
        .desktop-txt {
            display: none;
        }
        
        .mobil-txt {
            display: inline;
        }
        
        .svaerhed-valg {
            gap: 5px;
        }
        
        .svaerhed-boks {
            padding: 8px 10px;
            min-width: 90px;
        }
        
        .svaerhed-boks .navn {
            font-size: 12px;
        }
        
        .rytter-ctrls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .rytter-ctrls .btn-big {
            padding: 10px 14px;
            font-size: 14px;
            flex: 1;
            max-width: 160px;
        }

        /* Kontroltaster 2x2 grid på mobil */
        .box div[style*="display:flex"][style*="gap:15px"] {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 8px !important;
            max-width: 250px;
            margin: 0 auto;
        }
        
        .box div[style*="display:flex"][style*="gap:15px"] > div {
            padding: 6px 8px !important;
        }
        
        .box div[style*="display:flex"][style*="gap:15px"] > div > div:first-child {
            font-size: 16px !important;
        }
        
        .box div[style*="display:flex"][style*="gap:15px"] > div > div:last-child {
            font-size: 10px !important;
        }

        /* Statistik-canvas responsiv */
        #plotCanvas {
            height: 250px !important;
        }
        
        .tabs {
            flex-wrap: wrap;
            gap: 4px;
        }
        
        .tab {
            flex: 1 1 auto;
            min-width: 80px;
            text-align: center;
            font-size: 12px;
            padding: 6px 10px;
        }
        
        #plotLegend {
            font-size: 11px;
            line-height: 1.4;
            padding: 8px;
        }

		.plot-tabs {
		    flex-wrap: wrap;
		}
		
		.plot-tabs .tab:first-child {
		    flex: 0 0 100%;
		    margin-bottom: 4px;
		}
		
		.plot-tabs .tab:not(:first-child) {
		    flex: 1 1 30%;
		}
    }

</style>

        } else if (bjergVindere.length === 1) {
            afsnit.push(bjergVindere[0] + " dominerede og tog alle " + bjerge.length + " bjergspurter.");
        } else if (bjergVindere.length === 2) {
            afsnit.push("Bjergspurterne blev vundet af " + bjergVindere[0] + " og " + bjergVindere[1] + ".");
        } else {
            afsnit.push("Bjergspurterne blev fordelt mellem " + bjergVindere.slice(0, -1).join(", ") + " og " + bjergVindere[bjergVindere.length - 1] + ".");
        }
    }
    
    // MELLEMSPURTER
    if (sprints.length > 0 && (e.type === "flad" || e.type === "kuperet")) {
        var sprintVindere = [];
        for (var i = 0; i < sprints.length; i++) {
            var svn = sprints[i].data.vinder.split(" ").pop();
            if (sprintVindere.indexOf(svn) < 0) sprintVindere.push(svn);
        }
        if (sprints.length === 1) {
            afsnit.push("I dagens mellemspurt var " + sprintVindere[0] + " hurtigst.");
        } else if (sprintVindere.length === 1) {
            afsnit.push(sprintVindere[0] + " vandt begge dagens mellemspurter og scorede vigtige point til den grønne trøje.");
        } else if (sprintVindere.length === 2) {
            afsnit.push("Dagens to mellemspurter blev vundet af " + sprintVindere[0] + " og " + sprintVindere[1] + ".");
        } else {
            afsnit.push("Mellemspurterne blev fordelt mellem " + sprintVindere.slice(0, -1).join(", ") + " og " + sprintVindere[sprintVindere.length - 1] + ".");
        }
    }
    
    // ===== ETAPERESULTAT =====
    if (vinder && !erTT) {
        var vinderNavn = vinder.navn.split(" ").pop();
        
	if (vinderDiff === 0 && varLilleGruppe) {
	            afsnit.push(vinderNavn + " vandt spurten i en lille gruppe på " + vinderGruppeStr + " ryttere, " + fmtTidstab(gapTilFelt) + " foran hovedfeltet.");
	        } else if (vinderDiff === 0) {
	            afsnit.push(vinderNavn + " tog sejren i en tæt spurt foran " + 
	                       (res[1] ? res[1].r.navn.split(" ").pop() : "feltet") + ".");
        } else if (vinderDiff < 5) {
            afsnit.push(vinderNavn + " kastede cyklen over stregen og vandt med blot " + vinderDiff + " sekunder.");
		} else {
            // Solo-sejr: nævn hvor langt fra mål angrebet kom
            // Find hvad nr. 2 var - gruppe eller enkeltperson
            var nr2Navn = res[1] ? res[1].r.navn.split(" ").pop() : "forfølgerne";
            // Tæl hvor mange der kom ind på nr. 2's tid (inden for 3 sek)
            var nr2GruppeStr = 0;
            if (res[1]) {
                for (var i = 1; i < res.length; i++) {
                    if (Math.round(res[i].tid - res[1].tid) <= 3) {
                        nr2GruppeStr++;
                    } else {
                        break;
                    }
                }
            }
            var forfølgerTekst;
            if (nr2GruppeStr >= 30) {
                forfølgerTekst = "foran feltet";
            } else if (nr2GruppeStr >= 5) {
                forfølgerTekst = "foran forfølgergruppen";
            } else if (nr2GruppeStr >= 2) {
                forfølgerTekst = "foran forfølgerne";
            } else {
                forfølgerTekst = "foran " + nr2Navn;
            }
            
            var soloTekst = "";
            if (vinderAngrebKm >= 0) {
                var soloKm = Math.round(e.dist - vinderAngrebKm);
                if (soloKm > 0) {
                    soloTekst = vinderNavn + " stak af " + soloKm + " km fra mål og krydsede målstregen " + fmtTidstab(vinderDiff) + " " + forfølgerTekst + ".";
                } else {
                    soloTekst = vinderNavn + " kørte solo over stregen med " + fmtTidstab(vinderDiff) + " " + forfølgerTekst + ".";
                }
            } else if (vinderDiff < 30) {
                soloTekst = vinderNavn + " kørte solo over stregen med " + vinderDiff + " sekunder " + forfølgerTekst + ".";
            } else {
                soloTekst = vinderNavn + " krydsede målstregen " + fmtTidstab(vinderDiff) + " " + forfølgerTekst + ".";
            }
            afsnit.push(soloTekst);
        }
    } else if (vinder && erTT) {
        afsnit.push(vinder.navn.split(" ").pop() + " satte tiden " + ft(res[0].tid) + " som ingen kunne matche.");
    }
    
    // ===== TRØJESITUATION =====
    if (gcLeder) {
        var gcNr2 = gcS[1];
        var gcGap = gcNr2 ? Math.round(gcNr2.stid - gcLeder.stid) : 0;
        var gcLederNavn = gcLeder.navn.split(" ").pop();
        
        var gcVerb;
        if (erFoersteEtape) {
            gcVerb = "tager";
        } else if (!tidligereGcLeder) {
            gcVerb = "har";
        } else if (gcLeder.navn === tidligereGcLeder) {
            gcVerb = "beholder";
        } else {
            gcVerb = "erobrer";
        }
        
        var troejeTekst = gcLederNavn + " " + gcVerb + " den gule trøje";
        if (gcGap < 60 && gcNr2) {
            troejeTekst += " med kun " + gcGap + " sekunder ned til " + gcNr2.navn.split(" ").pop() + ".";
        } else if (gcNr2) {
            troejeTekst += " med " + ft(gcGap) + " til " + gcNr2.navn.split(" ").pop() + ".";
        } else {
            troejeTekst += ".";
        }
        
if (spLeder && (G.sprPts[spLeder.navn] || 0) > 0) {
            var spNr2 = spS[1];
            var spGap = spNr2 ? (G.sprPts[spLeder.navn] || 0) - (G.sprPts[spNr2.navn] || 0) : 0;
            var spLederNavn = spLeder.navn.split(" ").pop();
            var spVerb = "fører";
            if (!erFoersteEtape && tidligereSpLeder && tidligereSpLeder !== spLeder.navn) {
                spVerb = "overtager føringen i";
            }
            if (spGap < 20 && spNr2) {
                troejeTekst += " " + spLederNavn + " " + spVerb + " pointkonkurrencen med kun " + spGap + " point til " + spNr2.navn.split(" ").pop() + ".";
            } else {
                troejeTekst += " " + spLederNavn + " " + spVerb + " pointkonkurrencen.";
            }
        }
        
        if (bjLeder && (G.bjgPts[bjLeder.navn] || 0) > 0) {
            var bjLederNavn = bjLeder.navn.split(" ").pop();
            var bjVerb = "er i front i";
            if (!erFoersteEtape && tidligereBjLeder && tidligereBjLeder !== bjLeder.navn) {
                bjVerb = "overtager føringen i";
            }
            troejeTekst += " " + bjLederNavn + " " + bjVerb + " bjergkonkurrencen.";
        }
        
        afsnit.push(troejeTekst);
    }

    // ===== SPILLERENS PRÆSTATION =====
    var spiTekst = "";
    var spiTidstab = 0;
    if (spiRes && res[0]) {
        spiTidstab = Math.round(spiRes.tid - res[0].tid);
    }

    function fmtTidstab(sek) {
        sek = Math.round(Math.abs(sek));
        if (sek < 60) return sek + " sekunder";
        return ft(sek);
    }
    
    // Tæl spillerens totale etapesejre i DENNE tour (inkl. denne etape)
    var totaleSejre = 0;
    for (var i = 0; i < ETAPE_HISTORIK.length; i++) {
        if (ETAPE_HISTORIK[i].spiEtapePlads === 1) totaleSejre++;
    }
    
    // Tæl hvor mange etaper spilleren HAR VÆRET GC-leder
    var totalGuleDage = 0;
    for (var i = 0; i < ETAPE_HISTORIK.length; i++) {
        if (ETAPE_HISTORIK[i].gcLeder === G.spiller.navn) totalGuleDage++;
    }

    // 1) Ægte kollaps
    if (spillerKollapsEvent) {
        var kollapsKm = Math.round(spillerKollapsEvent.data.km || spillerKollapsEvent.km || 0);
        var tidTabTekst = Math.round(Math.abs(gcGabAendring)) >= 60 ? " og tabte " + fmtTidstab(gcGabAendring) + " i klassementet" : "";
        spiTekst = spiEfternavn + " gik helt kold ved km " + kollapsKm + tidTabTekst + ". Energien var fuldstændig opbrugt.";
        if (erGcLeder) {
            spiTekst += " Alligevel lykkedes det at beholde den gule trøje.";
        }
    }

	// 2) Etapesejr
    else if (spiPlads === 1) {
        // Etaperesultat og trøjesituation er allerede beskrevet ovenfor.
        // Hold spillerens afsnit kort og tilføj kun ny information.
        
        if (erGcLeder && varGcLeder && totalGuleDage > 2) {
            spiTekst = "Det er " + spiEfternavn + "s " + totaleSejre + ". etapesejr i denne Tour.";
        } else if (erGcLeder && !varGcLeder) {
            // Trøje-erobring er allerede nævnt - tilføj kun stemning
            if (totaleSejre === 1) {
                spiTekst = "En drømmedag for " + spiEfternavn + ", der vinder sin første etapesejr i dette års Tour!";
            } else {
                spiTekst = "Det er " + spiEfternavn + "s " + totaleSejre + ". etapesejr i denne Tour. En drømmedag!";
            }
        } else if (totaleSejre > 1) {
            spiTekst = "Det er " + spiEfternavn + "s " + totaleSejre + ". etapesejr i denne Tour!";
        } else if (gcGabAendring <= -60) {
            spiTekst = "En vigtig dag for " + spiEfternavn + " der hentede " + fmtTidstab(gcGabAendring) + " i klassementet.";
        } else {
            spiTekst = "En drømmedag for " + spiEfternavn + "!";
        }
    }

	// 3) 2. og 3. plads
    else if (spiPlads === 2) {
        if (gcGabAendring <= -60) {
            spiTekst = "Andenpladsen er et flot resultat for " + spiEfternavn + ", der hentede " + fmtTidstab(gcGabAendring) + " i klassementet.";
        } else if (gcGabAendring >= 60) {
            spiTekst = spiEfternavn + " måtte nøjes med andenpladsen og tabte " + fmtTidstab(gcGabAendring) + " i klassementet.";
        } else {
            spiTekst = spiEfternavn + " måtte se sig slået på stregen, men andenpladsen er et flot resultat.";
        }
    } else if (spiPlads === 3) {
        if (gcGabAendring <= -60) {
            spiTekst = "Tredjepladsen gik til " + spiEfternavn + ", der hentede " + fmtTidstab(gcGabAendring) + " i klassementet.";
        } else if (gcGabAendring >= 60) {
            spiTekst = spiEfternavn + " sluttede på tredjepladsen, men tabte " + fmtTidstab(gcGabAendring) + " i klassementet.";
        } else {
            spiTekst = "Tredjepladsen gik til " + spiEfternavn + ".";
        }
    }
    // 4) GC-leder der beholder trøjen
    else if (erGcLeder && varGcLeder) {
        if (Math.round(gcGabAendring) >= 60) {
            spiTekst = spiEfternavn + " havde en tung dag i gult og tabte " + fmtTidstab(gcGabAendring) + " til nærmeste rival, men beholdt føringen.";
        } else if (spiPlads <= 5) {
            spiTekst = spiEfternavn + " havde en stærk dag og sluttede som nr. " + spiPlads + ".";
        } else if (spiPlads <= 15) {
            spiTekst = spiEfternavn + " havde kontrol og sluttede som nr. " + spiPlads + ".";
        } else if (erTT) {
            spiTekst = spiEfternavn + " kørte en skuffende enkeltstart og endte som nr. " + spiPlads + ".";
        } else if (e.type === "flad") {
            spiTekst = spiEfternavn + " sparede kræfter i feltet.";
        } else {
            spiTekst = spiEfternavn + " tog ingen chancer og kørte defensivt.";
        }
    }

// 5) Erobrede GC-føringen (uden etapesejr)
    else if (erGcLeder && !varGcLeder) {
        if (spiPlads <= 5) {
            spiTekst = "Ud over at erobre den gule trøje leverede " + spiEfternavn + " en fantastisk præstation med en " + spiPlads + ". plads!";
        } else if (erTT) {
            spiTekst = "Ud over at erobre den gule trøje kørte " + spiEfternavn + " en solid enkeltstart som nr. " + spiPlads + ".";
        } else {
            spiTekst = "Ud over at overtage den gule trøje kørte " + spiEfternavn + " klogt og sluttede som nr. " + spiPlads + ".";
        }
    }
	
    // 6) Mistede den gule trøje
    else if (varGcLeder && !erGcLeder) {
        var nyLederNavn = gcS[0] ? gcS[0].navn.split(" ").pop() : "rivalen";
        spiTekst = spiEfternavn + " mistede den gule trøje til " + nyLederNavn + " og ligger nu nr. " + (spiGC + 1) + " i klassementet.";
    }

    // 7-9) Tidstab/gevinster
    else {
        var absGabAendring = Math.round(Math.abs(gcGabAendring));

        if (gcGabAendring >= 480) {
            spiTekst = "Det var en katastrofedag for " + spiEfternavn + "! Han tabte " + fmtTidstab(gcGabAendring) + " i klassementet og falder til " + (spiGC + 1) + ". plads.";
        } else if (gcGabAendring >= 180) {
            spiTekst = "Det var en hård dag for " + spiEfternavn + " der tabte " + fmtTidstab(gcGabAendring) + " i klassementet.";
            if (placeringAendring < -3) {
                spiTekst += " Han faldt fra " + spiGCFoer + ". til " + (spiGC + 1) + ". plads.";
            } else {
                spiTekst += " Han ligger nu nr. " + (spiGC + 1) + ".";
            }
        } else if (gcGabAendring >= 60) {
            spiTekst = spiEfternavn + " tabte " + fmtTidstab(gcGabAendring) + " i klassementet og ligger nu nr. " + (spiGC + 1) + ".";
        } else if (gcGabAendring <= -60) {
            spiTekst = "Det var en fremragende dag for " + spiEfternavn + " der hentede " + fmtTidstab(gcGabAendring) + " i klassementet!";
            if (placeringAendring >= 3) {
                spiTekst += " Han rykker op fra " + spiGCFoer + ". til " + (spiGC + 1) + ". plads.";
            } else {
                spiTekst += " Han ligger nu nr. " + (spiGC + 1) + ".";
            }
        } else if (gcGabAendring <= -10) {
            spiTekst = spiEfternavn + " hentede " + fmtTidstab(gcGabAendring) + " i klassementet og ligger nr. " + (spiGC + 1) + ".";
        } else if (gcGabAendring > 10) {
            spiTekst = spiEfternavn + " tabte " + fmtTidstab(gcGabAendring) + " i klassementet og ligger nr. " + (spiGC + 1) + ".";
        } else {
            // Ingen væsentlig ændring i klassementet
            if (spiPlads <= 5) {
                spiTekst = spiEfternavn + " var med helt fremme og sluttede på en flot " + spiPlads + ". plads.";
            } else if (spiPlads <= 10) {
                spiTekst = erTT 
                    ? "Solid enkeltstart for " + spiEfternavn + " med en " + spiPlads + ". plads."
                    : "Solid dag for " + spiEfternavn + " med en " + spiPlads + ". plads.";
            } else if (spiPlads <= 30) {
                spiTekst = erTT
                    ? spiEfternavn + " kørte en jævn enkeltstart som nr. " + spiPlads + "."
                    : spiEfternavn + " fulgte favoritterne sikkert i mål som nr. " + spiPlads + ".";
            } else {
                spiTekst = erTT
                    ? spiEfternavn + " sluttede som nr. " + spiPlads + " på enkeltstart."
                    : spiEfternavn + " kom i mål med hovedfeltet.";
            }
            // Tilføj GC-placering kun hvis relevant og ikke allerede nævnt
            if (spiGC < 10 && !erFoersteEtape) {
                spiTekst += " Han ligger nr. " + (spiGC + 1) + " i klassementet.";
            }
        }
    }

    afsnit.push(spiTekst);

    // UDGÅEDE RYTTERE
    if (udeRyttere && udeRyttere.length >= 5) {
        if (udeRyttere.length >= 20) {
            afsnit.push("Hele " + udeRyttere.length + " ryttere nåede ikke inden for tidsgrænsen og må forlade løbet. Feltet er fuldstændig decimeret.");
        } else if (udeRyttere.length >= 10) {
            afsnit.push("Det var en blodig dag for feltet. " + udeRyttere.length + " ryttere udgik efter ikke at nå inden for tidsgrænsen.");
        } else {
            afsnit.push(udeRyttere.length + " ryttere nåede ikke inden for tidsgrænsen og må forlade Touren.");
        }
    }
    
    // FREMADSKUENDE
    if (G.enr < 20) {
        var nesteE = G.etaper[G.enr + 1];
        var fremTekst = "";
        if (nesteE.type === "bjerg") {
            var bjergFrem = [
                "I morgen venter en brutal bjergetape til " + nesteE.slut + ". Der kan ske store ting i klassementet.",
                "Morgendagens bjergetape til " + nesteE.slut + " bliver afgørende for klassementet.",
                "Favoritterne vil teste hinanden på morgendagens bjergetape."
            ];
            fremTekst = bjergFrem[ri(0, bjergFrem.length - 1)];
        } else if (nesteE.type === "tt") {
            fremTekst = "Næste etape er en enkeltstart – sandhedens time for klassementrytterne.";
        } else if (nesteE.type === "kuperet") {
            fremTekst = "I morgen fortsætter Touren med en kuperet etape til " + nesteE.slut + ".";
        } else {
            var fladFrem = [
                "Sprinterne vil lugte blod på morgendagens flade etape til " + nesteE.slut + ".",
                "Morgendagens flade etape til " + nesteE.slut + " burde ende i massespurt.",
                "Sprinterholdene vil kontrollere morgendagens flade etape."
            ];
            fremTekst = fladFrem[ri(0, fladFrem.length - 1)];
        }
        afsnit.push(fremTekst);
    }
    
    var rensetAfsnit = [];
    for (var i = 0; i < afsnit.length; i++) {
        if (afsnit[i] && afsnit[i].trim() !== "") rensetAfsnit.push(afsnit[i]);
    }
    
    return {
        overskrift: overskrift,
        tekst: rensetAfsnit.join("\n\n")
    };
}

// ========== TOUR-AFSLUTNING: KARRIERE-RESUMÉ OG PLOTS ==========

function genererTourResume() {
    var spiEfternavn = G.navn.split(" ").pop();
    var aktive = G.ryttere.filter(function(r) { return !r.ude; });
    var gcS = aktive.slice().sort(function(a,b) { return a.stid - b.stid; });
    var spS = aktive.slice().sort(function(a,b) { return (G.sprPts[b.navn]||0) - (G.sprPts[a.navn]||0); });
    var bjS = aktive.slice().sort(function(a,b) { return (G.bjgPts[b.navn]||0) - (G.bjgPts[a.navn]||0); });
    
    var spiGC = -1;
    for (var i = 0; i < gcS.length; i++) { if (gcS[i].sp) { spiGC = i; break; } }
    
    var spiSp = -1;
    for (var i = 0; i < spS.length; i++) { if (spS[i].sp) { spiSp = i; break; } }
    
    var spiBj = -1;
    for (var i = 0; i < bjS.length; i++) { if (bjS[i].sp) { spiBj = i; break; } }
    
    // Tæl etapesejre og podier
    var sejre = 0, podier = 0, top10 = 0;
    var bedstePlads = 999;
    var daarligstePlads = 0;
    
    for (var i = 0; i < ETAPE_HISTORIK.length; i++) {
        var eh = ETAPE_HISTORIK[i];
        if (eh.spiEtapePlads === 1) sejre++;
        if (eh.spiEtapePlads <= 3) podier++;
        if (eh.spiEtapePlads <= 10) top10++;
        if (eh.spiEtapePlads < bedstePlads) bedstePlads = eh.spiEtapePlads;
        if (eh.spiEtapePlads > daarligstePlads) daarligstePlads = eh.spiEtapePlads;
    }
    
    // Trøjedage
    var guleDage = 0, groenneDage = 0, prikkede = 0;
    for (var i = 0; i < ETAPE_HISTORIK.length; i++) {
        if (ETAPE_HISTORIK[i].gcLeder === G.spiller.navn) guleDage++;
        if (ETAPE_HISTORIK[i].spLeder === G.spiller.navn) groenneDage++;
        if (ETAPE_HISTORIK[i].bjLeder === G.spiller.navn) prikkede++;
    }
    
    var afsnit = [];
    
    // OVERSKRIFT baseret på præstation
    var overskrift = "";
    if (spiGC === 0) {
        overskrift = "🏆 HISTORISK! " + G.navn.toUpperCase() + " VINDER TOUR DE FRANCE!";
    } else if (spiGC <= 2) {
        overskrift = "🎖️ " + spiEfternavn + " på podiet i Paris!";
    } else if (spiGC <= 9) {
        overskrift = spiEfternavn + " slutter i Top 10";
    } else if (sejre > 0) {
        overskrift = spiEfternavn + " tager " + sejre + " etapesejr" + (sejre > 1 ? "e" : "") + " i årets Tour";
    } else {
        overskrift = spiEfternavn + " gennemfører Tour de France";
    }
    
    // INTRO
    if (spiGC === 0) {
        afsnit.push("Efter tre uger og 21 etaper kan " + G.navn + " kalde sig vinder af Tour de France! En fantastisk præstation der vil blive husket i cykelhistorien.");
    } else if (spiGC <= 2) {
        var podiePlads = spiGC === 1 ? "andenpladsen" : "tredjepladsen";
        afsnit.push(G.navn + " kan se tilbage på et succesfuldt Tour de France med " + podiePlads + " i det samlede klassement.");
    } else {
        afsnit.push(G.navn + " har gennemført årets Tour de France og slutter på en " + (spiGC + 1) + ". plads samlet.");
    }
    
    // STATISTIK
    var statTekst = "Gennem de 21 etaper opnåede " + spiEfternavn + " ";
    var stats = [];
    if (sejre > 0) stats.push(sejre + " etapesejr" + (sejre > 1 ? "e" : ""));
    if (podier > sejre) stats.push((podier - sejre) + " yderligere podieplacering" + (podier - sejre > 1 ? "er" : ""));
    if (top10 > podier) stats.push((top10 - podier) + " yderligere top-10 placering" + (top10 - podier > 1 ? "er" : ""));
    
    if (stats.length > 0) {
        statTekst += stats.join(" og ") + ".";
    } else {
        statTekst = "Bedste etaperesultat var en " + bedstePlads + ". plads.";
    }
    afsnit.push(statTekst);
    
    // TRØJER
    if (guleDage > 0 || groenneDage > 0 || prikkede > 0) {
        var troejeTekst = "";
        if (guleDage > 0) {
            troejeTekst += spiEfternavn + " bar den gule trøje i " + guleDage + " dag" + (guleDage > 1 ? "e" : "") + ". ";
        }
        if (groenneDage > 0) {
            troejeTekst += "Den grønne trøje blev båret i " + groenneDage + " dag" + (groenneDage > 1 ? "e" : "") + ". ";
        }
        if (prikkede > 0) {
            troejeTekst += "Den prikkede bjergtrøje prydede skuldrene i " + prikkede + " dag" + (prikkede > 1 ? "e" : "") + ". ";
        }
        afsnit.push(troejeTekst.trim());
    }
    
// TRØJEVINDERE
    var vindere = [];
    if (gcS[0] && gcS[0].sp) vindere.push("den gule trøje");
    if (spS[0] && spS[0].sp) vindere.push("den grønne trøje");
    if (bjS[0] && bjS[0].sp) vindere.push("den prikkede trøje");
    
    if (vindere.length > 0) {
        var troejeTekst = "";
        if (vindere.length === 1) {
            troejeTekst = "Ved afslutningen i Paris kunne " + spiEfternavn + " fejre sejren i " + vindere[0] + ".";
        } else if (vindere.length === 2) {
            troejeTekst = "Ved afslutningen i Paris kunne " + spiEfternavn + " fejre sejren i både " + vindere[0] + " og " + vindere[1] + ".";
        } else {
            troejeTekst = "Ved afslutningen i Paris kunne " + spiEfternavn + " fejre den sjældne triumf med sejren i " + vindere[0] + ", " + vindere[1] + " og " + vindere[2] + "!";
        }
        afsnit.push(troejeTekst);
    }
    
    // KONKLUSION
    if (spiGC === 0) {
        afsnit.push("En Tour de France-sejr er kronen på værket i enhver cykelrytters karriere. " + G.navn + " har skrevet sig ind i historien!");
    } else if (spiGC <= 4) {
        afsnit.push("Et stærkt Tour de France der lover godt for fremtiden.");
    } else {
        afsnit.push("Erfaringerne fra dette Tour de France kan bruges i jagten på endnu bedre resultater næste år.");
    }
    
    return {
        overskrift: overskrift,
        tekst: afsnit.join("\n\n"),
        stats: {
            gcPlads: spiGC + 1,
            spPlads: spiSp + 1,
            bjPlads: spiBj + 1,
            sejre: sejre,
            podier: podier,
            top10: top10,
            guleDage: guleDage,
            groenneDage: groenneDage,
            prikkede: prikkede
        }
    };
}

function genENyt() {
    var typer = [];
    
    // Definer antal af hver type
    var antalBjerg = ri(5, 7);
    var antalKuperet = ri(4, 6);
    var antalTT = 2;
    var antalFlad = 21 - antalBjerg - antalKuperet - antalTT;
    
    // Sørg for mindst 4 flade
    if (antalFlad < 4) {
        var diff = 4 - antalFlad;
        if (antalBjerg > 5) { antalBjerg -= Math.min(diff, antalBjerg - 5); diff = 4 - (21 - antalBjerg - antalKuperet - antalTT); }
        if (diff > 0 && antalKuperet > 4) { antalKuperet -= Math.min(diff, antalKuperet - 4); }
        antalFlad = 21 - antalBjerg - antalKuperet - antalTT;
    }
    
    // Byg typeliste
    for (var i = 0; i < antalFlad; i++) typer.push("flad");
    for (var i = 0; i < antalKuperet; i++) typer.push("kuperet");
    for (var i = 0; i < antalBjerg; i++) typer.push("bjerg");
    
    // Bland dem (uden TT endnu)
    typer = sh(typer);
    
    // Første og sidste etape er altid flade
    // Fjern to flade fra listen
    var flatCount = 0;
    for (var i = typer.length - 1; i >= 0; i--) {
        if (typer[i] === "flad" && flatCount < 2) {
            typer.splice(i, 1);
            flatCount++;
        }
    }
    
    // Sæt flad på position 0 og 20 (første og sidste)
    var endelig = new Array(21);
    endelig[0] = "flad";
    endelig[20] = "flad";
    
    // Placer TT1 i etape 3-7 (tidlig TT)
    var tt1Pos = ri(3, 7);
    endelig[tt1Pos] = "tt";
    
    // Placer TT2 i etape 15-19 (sen TT), mindst 5 etaper fra TT1
    var tt2Min = Math.max(15, tt1Pos + 5);
    var tt2Max = 19;
    if (tt2Min > tt2Max) tt2Min = tt2Max;
    var tt2Pos = ri(tt2Min, tt2Max);
    endelig[tt2Pos] = "tt";
    
    // Fyld resten ind
    var typerIdx = 0;
    for (var i = 0; i < 21; i++) {
        if (endelig[i]) continue; // Allerede sat
        endelig[i] = typer[typerIdx];
        typerIdx++;
    }
    
    // Valider: ingen to TT ved siden af hinanden (skulle ikke ske med min 5 afstand, men sikkerhed)
    for (var i = 0; i < 20; i++) {
        if (endelig[i] === "tt" && endelig[i+1] === "tt") {
            // Swap den anden TT med en tilfældig ikke-TT position
            for (var j = 0; j < 21; j++) {
                if (endelig[j] !== "tt" && j !== i && j !== i+1 && Math.abs(j - i) >= 5) {
                    var tmp = endelig[i+1];
                    endelig[i+1] = endelig[j];
                    endelig[j] = tmp;
                    break;
                }
            }
        }
    }
    
    // Normale byer
    var normaleByer = [
        "Lille", "Bruxelles", "Dunkerque", "Calais", "Rouen", "Chartres", "Orléans", 
        "Limoges", "Clermont-Ferrand", "Saint-Étienne", "Gap", "Briançon", 
        "Barcelonnette", "Nice", "Monaco", "Menton", "Digne", "Valence", 
        "Villard-de-Lans", "Grenoble", "Lyon", "Marseille", "Toulouse", 
        "Bordeaux", "Nantes", "Rennes", "Strasbourg", "Dijon", "Montpellier",
        "Perpignan", "Pau", "Biarritz", "La Rochelle", "Angers", "Tours",
        "Megève", "Chamonix", "Annecy", "Chambéry", "Albertville", "Bourg-en-Bresse"
    ];
    
    var bjergToppe = [
        "Alpe d'Huez", "Col du Tourmalet", "Mont Ventoux", "Col du Galibier",
        "Pla d'Adet", "Luz Ardiden", "Col du Portet", "Hautacam", "Superbagnères"
    ];
    
    var blandedeByer = sh(normaleByer);
    var blandedeBjergToppe = sh(bjergToppe);
    var bjergTopIdx = 0;
    
    var brugteByer = [blandedeByer.shift()];
    
    for (var i = 0; i < endelig.length; i++) {
        var etapeType = endelig[i];
        
        if (etapeType === "bjerg" && Math.random() < 0.4 && bjergTopIdx < blandedeBjergToppe.length) {
            brugteByer.push(blandedeBjergToppe[bjergTopIdx]);
            bjergTopIdx++;
        } else {
            brugteByer.push(blandedeByer.shift());
        }
    }
    
    brugteByer[21] = "Paris";
    
    var result = [];
    for (var i = 0; i < endelig.length; i++) {
        var x = endelig[i];
        result.push({ 
            nr: i+1, 
            type: x, 
            start: i === 0 ? brugteByer[0] : brugteByer[i], 
            slut: brugteByer[i + 1] || "Paris", 
            dist: x === "tt" ? ri(28,42) : x === "bjerg" ? ri(155,180) : ri(170,210) 
        });
    }
    return result;
}

            '<div class="tab ' + (G.plotTab === "etaper" ? "active" : "") + '" onclick="G.plotTab=\'etaper\';visPlots()">📊 Etaper</div>' +
            '<div class="tab tab-gc ' + (G.plotTab === "gc" ? "active" : "") + '" onclick="G.plotTab=\'gc\';visPlots()">🟡 Gul</div>' +
            '<div class="tab tab-sp ' + (G.plotTab === "groen" ? "active" : "") + '" onclick="G.plotTab=\'groen\';visPlots()">🟢 Grøn</div>' +
            '<div class="tab tab-bj ' + (G.plotTab === "prikket" ? "active" : "") + '" onclick="G.plotTab=\'prikket\';visPlots()">🔴 Prikket</div>' +

    R(html);

}

function tegnPlot(type) {
    var c = $("plotCanvas");
    if (!c) return;
    
    c.width = c.parentElement.clientWidth - 4;
    c.height = 320;
    var ctx = c.getContext("2d");
    
    // Baggrund
    ctx.fillStyle = "#0a0a0a";
    ctx.fillRect(0, 0, c.width, c.height);
    
    var l = 50;      // Venstre margin
    var r = 20;      // Højre margin
    var t = 50;      // Top margin
    var b = 50;      // Bund margin
    var w = c.width - l - r;
    var h = c.height - t - b;
    
    var etaper = ETAPE_HISTORIK.length;
    if (etaper === 0) {
        ctx.fillStyle = "#888";
        ctx.font = "16px monospace";
        ctx.textAlign = "center";
        ctx.fillText("Ingen data endnu", c.width / 2, c.height / 2);
        return;
    }
    
    // Tegn akserne
    ctx.strokeStyle = "#444";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(l, t);
    ctx.lineTo(l, t + h);
    ctx.lineTo(l + w, t + h);
    ctx.stroke();
    
    if (type === "etaper") {
        // ===== ETAPERESULTATER (kategoriseret søjlediagram) =====
        
        // Titel
        ctx.fillStyle = "#ff0";
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.fillText("Dine etaperesultater", c.width / 2, 20);
        
        // Tæl placeringer i hver kategori
        var kategorier = [
            { navn: "1.", count: 0, farve: "#ff0" },
            { navn: "2.", count: 0, farve: "#ccc" },
            { navn: "3.", count: 0, farve: "#cd7f32" },
            { navn: "4-10", count: 0, farve: "#0f0" },
            { navn: "11-20", count: 0, farve: "#0aa" },
            { navn: "21-50", count: 0, farve: "#a6f" },
            { navn: "Andre", count: 0, farve: "#666" }
        ];
        
        for (var i = 0; i < etaper; i++) {
            var plads = ETAPE_HISTORIK[i].spiEtapePlads;
            
            if (plads === 1) {
                kategorier[0].count++;
            } else if (plads === 2) {
                kategorier[1].count++;
            } else if (plads === 3) {
                kategorier[2].count++;
            } else if (plads <= 10) {
                kategorier[3].count++;
            } else if (plads <= 20) {
                kategorier[4].count++;
            } else if (plads <= 50) {
                kategorier[5].count++;
            } else {
                kategorier[6].count++;
            }
        }
        
        // Find max count for skala
        var maxCount = 1;
        for (var i = 0; i < kategorier.length; i++) {
            if (kategorier[i].count > maxCount) maxCount = kategorier[i].count;
        }
        
        // Tegn søjler
        var barW = Math.floor(w / kategorier.length) - 10;
        var gap = (w - (barW * kategorier.length)) / (kategorier.length + 1);
        
        // Y-akse labels
        ctx.fillStyle = "#888";
        ctx.font = "10px monospace";
        ctx.textAlign = "right";
        ctx.fillText(maxCount, l - 5, t + 10);
        ctx.fillText(Math.round(maxCount / 2), l - 5, t + h / 2);
        ctx.fillText("0", l - 5, t + h);
        
        // Y-akse titel
        ctx.save();
        ctx.translate(12, t + h / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = "center";
        ctx.fillText("Antal etaper", 0, 0);
        ctx.restore();
        
        for (var i = 0; i < kategorier.length; i++) {
            var kat = kategorier[i];
            var barH = (kat.count / maxCount) * h;
            var x = l + gap + i * (barW + gap);
            var y = t + h - barH;
            
            if (kat.count > 0) {
                ctx.fillStyle = kat.farve;
                ctx.fillRect(x, y, barW, barH);
                
                ctx.fillStyle = "#000";
                ctx.font = "bold 12px monospace";
                ctx.textAlign = "center";
                if (barH > 20) {
                    ctx.fillText(kat.count, x + barW / 2, y + 15);
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.fillText(kat.count, x + barW / 2, y - 5);
                }
            } else {
                ctx.strokeStyle = kat.farve;
                ctx.lineWidth = 1;
                ctx.strokeRect(x, t + h - 2, barW, 2);
            }
            
            ctx.fillStyle = kat.farve;
            ctx.font = "10px monospace";
            ctx.textAlign = "center";
            ctx.fillText(kat.navn, x + barW / 2, t + h + 15);
        }
        
        // Legende
        var sejre = kategorier[0].count;
        var podier = kategorier[0].count + kategorier[1].count + kategorier[2].count;
        var top10Total = podier + kategorier[3].count;
        
        $("plotLegend").innerHTML = 
            '<span style="color:#ff0">🏆 ' + sejre + ' sejr' + (sejre !== 1 ? 'e' : '') + '</span> · ' +
            '<span style="color:#f80">🥇🥈🥉 ' + podier + ' podier</span> · ' +
            '<span style="color:#0aa">Top 10: ' + top10Total + '</span>';

    } else if (type === "gc" || type === "groen" || type === "prikket") {
        // ===== TRØJE-PLACERING (linjegraf) =====
        
        var trojeConfig;
        if (type === "gc") {
            trojeConfig = {
                titel: "Din GC-placering (Gul trøje)",
                farve: "#ff0",
                emoji: "🟡",
                pladsKey: "spiGCPlads",
                lederKey: "gcLeder",
                troejeNavn: "gult"
            };
        } else if (type === "groen") {
            trojeConfig = {
                titel: "Din sprint-placering (Grøn trøje)",
                farve: "#0f0",
                emoji: "🟢",
                pladsKey: "spiSpPlads",
                lederKey: "spLeder",
                troejeNavn: "grønt"
            };
        } else {
            trojeConfig = {
                titel: "Din bjerg-placering (Prikket trøje)",
                farve: "#f44",
                emoji: "🔴",
                pladsKey: "spiBjPlads",
                lederKey: "bjLeder",
                troejeNavn: "prikket"
            };
        }
        
        // Titel
        ctx.fillStyle = trojeConfig.farve;
        ctx.font = "bold 14px monospace";
        ctx.textAlign = "center";
        ctx.fillText(trojeConfig.titel, c.width / 2, 20);
        
        // Find max placering
        var maxPlads = 1;
        for (var i = 0; i < etaper; i++) {
            var plads = ETAPE_HISTORIK[i][trojeConfig.pladsKey];
            if (plads && plads > maxPlads) {
                maxPlads = plads;
            }
        }
        maxPlads = Math.min(Math.ceil(maxPlads / 5) * 5 + 5, 50);
        
        // Tæl dage i trøjen
        var dageITroeje = 0;
        for (var i = 0; i < etaper; i++) {
            if (ETAPE_HISTORIK[i][trojeConfig.lederKey] === G.spiller.navn) {
                dageITroeje++;
            }
        }
        
        // Y-akse labels (inverteret - 1 øverst)
        ctx.fillStyle = "#888";
        ctx.font = "10px monospace";
        ctx.textAlign = "right";
        ctx.fillText("1", l - 5, t + 10);
        ctx.fillText(Math.round(maxPlads / 2), l - 5, t + h / 2);
        ctx.fillText(maxPlads, l - 5, t + h - 5);
        
        // Y-akse titel
        ctx.save();
        ctx.translate(12, t + h / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = "center";
        ctx.fillText("Placering", 0, 0);
        ctx.restore();
        
        // Tegn gitterlinjer
        ctx.strokeStyle = "#222";
        ctx.lineWidth = 1;
        for (var i = 1; i < 5; i++) {
            var gy = t + (h / 5) * i;
            ctx.beginPath();
            ctx.moveTo(l, gy);
            ctx.lineTo(l + w, gy);
            ctx.stroke();
        }
        
        // Tegn linjen
        ctx.strokeStyle = trojeConfig.farve;
        ctx.lineWidth = 3;
        ctx.beginPath();
        var harData = false;
        for (var i = 0; i < etaper; i++) {
            var eh = ETAPE_HISTORIK[i];
            var plads = eh[trojeConfig.pladsKey];
            if (!plads || plads <= 0) continue;
            
            var x = l + (i / (etaper - 1 || 1)) * w;
            var y = t + ((plads - 1) / (maxPlads - 1)) * h;
            if (!harData) {
                ctx.moveTo(x, y);
                harData = true;
            } else {
                ctx.lineTo(x, y);
            }
        }
        ctx.stroke();
        
        // Tegn punkter
        for (var i = 0; i < etaper; i++) {
            var eh = ETAPE_HISTORIK[i];
            var plads = eh[trojeConfig.pladsKey];
            if (!plads || plads <= 0) continue;
            
            var x = l + (i / (etaper - 1 || 1)) * w;
            var y = t + ((plads - 1) / (maxPlads - 1)) * h;
            
            // Farve baseret på om spilleren bar trøjen
            var barTroeje = eh[trojeConfig.lederKey] === G.spiller.navn;
            
            if (barTroeje) {
                ctx.fillStyle = trojeConfig.farve;
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.font = "bold 8px monospace";
                ctx.textAlign = "center";
                ctx.fillText("★", x, y + 3);
            } else if (plads === 1) {
                ctx.fillStyle = trojeConfig.farve;
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            } else if (plads <= 3) {
                ctx.fillStyle = "#f80";
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            } else if (plads <= 10) {
                ctx.fillStyle = "#0f0";
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = "#0aa";
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Vis placering ved HVER prik
            ctx.fillStyle = "#fff";
            ctx.font = "9px monospace";
            ctx.textAlign = "center";
            ctx.fillText(plads, x, y - 12);

        }
        
        // X-akse labels
        ctx.fillStyle = "#888";
        ctx.font = "9px monospace";
        ctx.textAlign = "center";
        ctx.fillText("1", l, t + h + 15);
        ctx.fillText(Math.round(etaper / 2), l + w / 2, t + h + 15);
        ctx.fillText(etaper, l + w, t + h + 15);
        ctx.fillText("Etape", l + w / 2, c.height - 5);
        
        // Legende
        var slutPlads = ETAPE_HISTORIK[etaper - 1][trojeConfig.pladsKey] || "?";
        var legendHtml = 'Slutplacering: <span style="color:' + trojeConfig.farve + ';font-weight:bold">' + slutPlads + '. plads</span>';
        if (dageITroeje > 0) {
            legendHtml += ' · <span style="color:' + trojeConfig.farve + '">' + trojeConfig.emoji + ' ' + dageITroeje + ' dag' + (dageITroeje > 1 ? 'e' : '') + ' i ' + trojeConfig.troejeNavn + '</span>';
        }
        $("plotLegend").innerHTML = legendHtml;
    }
}

var wakeLock = null;

// Anmod om wake lock
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Wake Lock aktiv - skærmen slukker ikke');
            
            // Lyt efter release (fx hvis bruger skifter tab)
            wakeLock.addEventListener('release', function() {
                console.log('Wake Lock frigivet');
            });

        }

}

        wakeLock.release();
        wakeLock = null;
        console.log('Wake Lock frigivet manuelt');
    }
}

// Genaktiver wake lock når brugeren kommer tilbage til siden

        await requestWakeLock();
    }
});


// Gem spiltilstand til localStorage
function gemSpil(etapeFærdig) {
    var saveData = {
        version: 2,
        navn: G.navn,
        tourNr: G.tourNr,
        enr: G.enr,
        etapeFærdig: etapeFærdig || false,
        stilTab: G.stilTab,
        sprPts: G.sprPts,
        bjgPts: G.bjgPts,
        ryttere: [],
        bonusPoint: G.bonusPoint || 0,
	etapeHistorik: ETAPE_HISTORIK,
	svaerhed: G.svaerhed
    };
    
    // Gem rytterdata
    for (var i = 0; i < G.ryttere.length; i++) {
        var r = G.ryttere[i];
        saveData.ryttere.push({
            navn: r.navn,
            orig: r.orig,
            hold: r.hold,
            holdAbbr: r.holdAbbr,
            holdClr: r.holdClr,
            sp: r.sp,
            gc: r.gc,
            bj: r.bj,
            spr: r.spr,
            tt: r.tt,
            ud: r.ud,
            re: r.re,
            fl: r.fl,
            energi: r.energi,
            stid: r.stid,
            ude: r.ude
        });
    }
    
    // Gem etaper
    saveData.etaper = G.etaper;
    
    localStorage.setItem('tourDeFranceSave', JSON.stringify(saveData));
    console.log('Spil gemt!');
}

// Hent spiltilstand fra localStorage
function hentSpil() {
    var saved = localStorage.getItem('tourDeFranceSave');
    if (!saved) return null;
    
    try {
        return JSON.parse(saved);
    } catch (e) {
        console.error('Fejl ved indlæsning af gemt spil:', e);
        return null;
    }
}

// Slet gemt spil
function sletGemtSpil() {
    localStorage.removeItem('tourDeFranceSave');
    console.log('Gemt spil slettet!');
}

// Check om der er et gemt spil
function harGemtSpil() {
    return localStorage.getItem('tourDeFranceSave') !== null;
}
    
function indlaesGemtSpil() {
    var saveData = hentSpil();
    if (!saveData) return false;
    
    // Check version
    var CURRENT_VERSION = 2;
    if (!saveData.version || saveData.version < CURRENT_VERSION) {
        console.log('Gammelt save format - sletter og starter forfra');
        sletGemtSpil();
        return false;
    }
    
    G.navn = saveData.navn;
    G.tourNr = saveData.tourNr;
    G.enr = saveData.enr;
    G.stilTab = saveData.stilTab || "gc";
    G.sprPts = saveData.sprPts;
    G.bjgPts = saveData.bjgPts;
    G.etaper = saveData.etaper;
    ETAPE_HISTORIK = saveData.etapeHistorik || [];
    G.bonusPoint = saveData.bonusPoint || 0;
    G.svaerhed = saveData.svaerhed || "normal";
    
    G.ryttere = [];
    for (var i = 0; i < saveData.ryttere.length; i++) {
        var r = saveData.ryttere[i];
        G.ryttere.push(r);
        if (r.sp) G.spiller = G.ryttere[G.ryttere.length - 1];
    }

    // Normalisér energi ift. nuværende sværhedsgrad (sikrer at vi ikke ser >100% / for lave procenter efter load)
    var maxE = getMaxEnergi();
    for (var i = 0; i < G.ryttere.length; i++) {
        var r = G.ryttere[i];
        if (typeof r.energi !== "number") continue;
        // Begræns til maxE, så vi aldrig ligger over 100% i visning
        if (r.energi > maxE) r.energi = maxE;
        // Undgå negative værdier (bare sikkerhed)
        if (r.energi < 0) r.energi = 0;
    }

    
    // Hvis etapen var færdig, gå til næste
    if (saveData.etapeFærdig) {
        if (G.enr >= 20) {
            // Sidste etape var færdig - vis slutresultat i stedet
            G.enr = 20;  // Behold på 20
            return 'slut';  // Returnér special værdi
        } else {
            G.enr++;
        }
    }

    return true;
}

function ri(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function rf(a, b) { return Math.random() * (b - a) + a; }
function sh(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = ri(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function ft(s) { 
    s = Math.floor(Math.abs(s)); 
    var h = Math.floor(s/3600);
    var m = String(Math.floor((s%3600)/60)).padStart(2,"0");
    var sec = String(s%60).padStart(2,"0");
    return h + ":" + m + ":" + sec; 
}
function ec(e, m) { return (e/m) < 0.25 ? "low" : (e/m) < 0.5 ? "med" : ""; }
function $(id) { return document.getElementById(id); }
function R(h) { document.getElementById("game").innerHTML = h; }

function findInArr(arr, fn) {
    for (var i = 0; i < arr.length; i++) {
        if (fn(arr[i])) return arr[i];
    }
    return null;
}

function findIdx(arr, fn) {
    for (var i = 0; i < arr.length; i++) {
        if (fn(arr[i])) return i;
    }
    return -1;
}

function genE() {
    var t = ["flad","kuperet","flad","bjerg","flad","kuperet","bjerg","kuperet","bjerg","tt","bjerg","kuperet","bjerg","flad","bjerg","kuperet","bjerg","kuperet","bjerg","tt","flad"];
    var result = [];
    for (var i = 0; i < t.length; i++) {
        var x = t[i];
        result.push({ 
            nr: i+1, 
            type: x, 
            start: i===0 ? "Lille" : BYER[i-1], 
            slut: BYER[i], 
            dist: x==="tt" ? ri(28,42) : x==="bjerg" ? ri(155,180) : ri(170,210) 
        });
    }
    return result;
}

function genENyt() {
    var typer = [];
    
    // Definer antal af hver type
    var antalBjerg = ri(5, 7);
    var antalKuperet = ri(4, 6);
    var antalTT = 2;
    var antalFlad = 21 - antalBjerg - antalKuperet - antalTT;
    
    // Sørg for mindst 4 flade
    if (antalFlad < 4) {
        var diff = 4 - antalFlad;
        if (antalBjerg > 5) { antalBjerg -= Math.min(diff, antalBjerg - 5); diff = 4 - (21 - antalBjerg - antalKuperet - antalTT); }
        if (diff > 0 && antalKuperet > 4) { antalKuperet -= Math.min(diff, antalKuperet - 4); }
        antalFlad = 21 - antalBjerg - antalKuperet - antalTT;
    }
    
    // Byg typeliste
    for (var i = 0; i < antalFlad; i++) typer.push("flad");
    for (var i = 0; i < antalKuperet; i++) typer.push("kuperet");
    for (var i = 0; i < antalBjerg; i++) typer.push("bjerg");
    
    // Bland dem (uden TT endnu)
    typer = sh(typer);
    
    // Første og sidste etape er altid flade
    // Fjern to flade fra listen
    var flatCount = 0;
    for (var i = typer.length - 1; i >= 0; i--) {
        if (typer[i] === "flad" && flatCount < 2) {
            typer.splice(i, 1);
            flatCount++;
        }
    }
    
    // Sæt flad på position 0 og 20 (første og sidste)
    var endelig = new Array(21);
    endelig[0] = "flad";
    endelig[20] = "flad";
    
    // Placer TT1 i etape 3-7 (tidlig TT)
    var tt1Pos = ri(3, 7);
    endelig[tt1Pos] = "tt";
    
    // Placer TT2 i etape 15-19 (sen TT), mindst 5 etaper fra TT1
    var tt2Min = Math.max(15, tt1Pos + 5);
    var tt2Max = 19;
    if (tt2Min > tt2Max) tt2Min = tt2Max;
    var tt2Pos = ri(tt2Min, tt2Max);
    endelig[tt2Pos] = "tt";
    
    // Fyld resten ind
    var typerIdx = 0;
    for (var i = 0; i < 21; i++) {
        if (endelig[i]) continue; // Allerede sat
        endelig[i] = typer[typerIdx];
        typerIdx++;
    }
    
    // Valider: ingen to TT ved siden af hinanden (skulle ikke ske med min 5 afstand, men sikkerhed)
    for (var i = 0; i < 20; i++) {
        if (endelig[i] === "tt" && endelig[i+1] === "tt") {
            // Swap den anden TT med en tilfældig ikke-TT position
            for (var j = 0; j < 21; j++) {
                if (endelig[j] !== "tt" && j !== i && j !== i+1 && Math.abs(j - i) >= 5) {
                    var tmp = endelig[i+1];
                    endelig[i+1] = endelig[j];

    }

}

function genP(e) {
    var info = ETYPER[e.type]; 
    var p = [];
    var h = ri(150, 300); // Starthøjde
    
    if (e.type === "flad") {
        // Flade etaper: Små bølger, aldrig helt fladt
        for (var k = 0; k <= e.dist; k++) {
            h += ri(-8, 8);
            if (k % 20 === 0) h += ri(-15, 15);
            h = Math.max(20, Math.min(400, h));
            p.push(h);
        }
    } else if (e.type === "kuperet") {
        // Kuperede etaper: Flere bakker op og ned
        var bakker = ri(4, 7);
        var bakkePos = [];
        for (var i = 0; i < bakker; i++) {
            bakkePos.push(Math.floor(e.dist * (i + 0.5) / bakker) + ri(-10, 10));
        }
        
        for (var k = 0; k <= e.dist; k++) {
            var bakkeEffect = 0;
            for (var i = 0; i < bakkePos.length; i++) {
                var afstand = Math.abs(k - bakkePos[i]);
                var bakkeHøjde = ri(200, 450);
                var bakkeBredde = ri(8, 15);
                if (afstand < bakkeBredde) {
                    bakkeEffect += (bakkeBredde - afstand) / bakkeBredde * bakkeHøjde;
                }
            }
            h = 150 + bakkeEffect + ri(-20, 20);
            h = Math.max(80, Math.min(info.mh, h));
            p.push(h);
        }
    } else if (e.type === "bjerg") {
        // Bjergetaper: Store bjerge med kantede profiler
        var bjerge = ri(2, 4);
        var bjergData = [];
        
        for (var i = 0; i < bjerge; i++) {
            var pos = Math.floor(e.dist * (i + 0.5) / bjerge) + ri(-15, 15);
            pos = Math.max(25, Math.min(e.dist - 25, pos));
            var opLængde = ri(12, 22); // Længde af opstigning
            var nedLængde = ri(8, 16); // Længde af nedkørsel
            bjergData.push({
                pos: pos,
                højde: ri(1400, 2300),
                opLængde: opLængde,
                nedLængde: nedLængde,
                opStart: pos - opLængde,
                topPos: pos,
                nedSlut: pos + nedLængde
            });
        }
        
        bjergData.sort(function(a, b) { return a.pos - b.pos; });
        
        // Evt. bjergfinish
        var bjergFinish = Math.random() < 0.5;
        if (bjergFinish) {
            var finishPos = e.dist;
            var opLen = ri(15, 25);
            bjergData.push({
                pos: finishPos,
                højde: ri(1600, 2400),
                opLængde: opLen,
                nedLængde: 0, // Ingen nedkørsel - finish på toppen
                opStart: finishPos - opLen,
                topPos: finishPos,
                nedSlut: finishPos
            });
        }
        
        var baseHøjde = ri(200, 400);
        
        for (var k = 0; k <= e.dist; k++) {
            var totalHøjde = baseHøjde;
            
            for (var i = 0; i < bjergData.length; i++) {
                var bjerg = bjergData[i];
                
                if (k >= bjerg.opStart && k <= bjerg.topPos) {
                    // Op ad bjerget - lineær stigning med lidt variation
                    var progress = (k - bjerg.opStart) / bjerg.opLængde;
                    totalHøjde += bjerg.højde * progress;
                    // Tilføj lidt kantethed
                    if (ri(0, 3) === 0) totalHøjde += ri(-40, 60);
                } else if (k > bjerg.topPos && k <= bjerg.nedSlut) {
                    // Ned ad bjerget - lineær nedstigning
                    var progress = (k - bjerg.topPos) / bjerg.nedLængde;
                    totalHøjde += bjerg.højde * (1 - progress);
                    // Tilføj lidt kantethed
                    if (ri(0, 3) === 0) totalHøjde += ri(-30, 40);
                }
            }
            
            // Generel variation mellem bjerge
            totalHøjde += ri(-25, 25);
            
            h = Math.max(100, Math.min(info.mh, totalHøjde));
            p.push(h);
        }
        
        // Gem bjergtoppe til brug for mellempunkter
        e.bjergToppe = [];
        for (var i = 0; i < bjergData.length; i++) {
            if (bjergData[i].topPos < e.dist) { // Ikke finish
                e.bjergToppe.push(bjergData[i].topPos);
            }
        }
        
    } else if (e.type === "tt") {
        // Enkeltstart: Relativt fladt med små variationer
        for (var k = 0; k <= e.dist; k++) {
            h += ri(-5, 5);
            if (k % 8 === 0) h += ri(-20, 20);
            h = Math.max(50, Math.min(350, h));
            p.push(h);
        }
    }
    
    return p;
}

function getStigningVis() {

    if (!G.profil || G.profil.length < 2) return '<span style="' + baseStyle + ';border:1px solid #666;color:#666">—</span>';
    
    var ki = Math.min(Math.floor(G.km), G.profil.length - 2);
    var stig = G.profil[ki + 1] - G.profil[ki];
    
    var ikon, farve, tekst;
    if (stig > 40) {
        ikon = "🔥"; farve = "#f00"; tekst = "HC!";
    } else if (stig > 25) {
        ikon = "⛰️"; farve = "#f44"; tekst = "Stejlt!";

function genMP(e) {
    if (e.type === "tt") return [];
    
    var mps = [];
    
if (e.type === "bjerg") {
    // Bjergspurt på ALLE bjergtoppe (finish er allerede ekskluderet i genP)

        for (var i = 0; i < e.bjergToppe.length; i++) {
            mps.push({
                km: e.bjergToppe[i],
                type: "bjerg",
                done: false,

            });
        }
    }
}
 else if (e.type === "kuperet") {
        // Kuperede etaper: En pointspurt og en bjergspurt (højeste punkt)
        mps.push({
            km: Math.floor(e.dist * 0.4),
            type: "sprint",
            done: false,
            pts: [20, 17, 15, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1]
        });
        // Find højeste punkt på etapen for bjergspurt
        var højestePunkt = 0;
        var højesteKm = Math.floor(e.dist * 0.6);
        // Dette sættes korrekt efter profilen er genereret
        mps.push({
            km: højesteKm,
            type: "bjerg",
            done: false,
            pts: [10, 8, 6, 4, 2, 1] // Maks 10 point
        });
    } else if (e.type === "flad") {
        // Flade etaper: To pointspurter
        mps.push({
            km: Math.floor(e.dist * 0.35),
            type: "sprint",
            done: false,
            pts: [20, 17, 15, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1]
        });
        mps.push({
            km: Math.floor(e.dist * 0.65),
            type: "sprint",
            done: false,
            pts: [20, 17, 15, 13, 11, 9, 7, 6, 5, 4, 3, 2, 1]
        });
    }
    
    // Sortér efter km
    mps.sort(function(a, b) { return a.km - b.km; });
    
    return mps;
}

        '<div class="sbar"><span class="lbl">Sprint:</span><div class="bg"><div class="fill" style="width:'+r.spr+'%;background:#4f4"></div></div><span>'+r.spr+'</span></div>' +
